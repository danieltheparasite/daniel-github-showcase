<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daniel Inc. · GitHub projects</title>
<meta name="description" content="Daniel Inc. shows the GitHub projects of danieltheparasite on a low-poly 3D desk.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8' shape-rendering='crispEdges'%3E%3Crect width='8' height='8' fill='%23222'/%3E%3Cpath d='M1 1h4v1h1v4h-1v1h-4z' fill='%23ffd166'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<div id="loader" role="status" aria-label="Loading"><div class="boot"><canvas id="pic" width="64" height="64" aria-hidden="true"></canvas><div class="boot-body"><div class="boot-title">Welcome to Daniel Inc.</div><div class="bar"><i id="fill"></i></div></div></div><div class="boot-status" id="boot-status">Starting up…</div></div>
<header class="top">
  <a class="brand" href="./"><img class="av" src="assets/profile.png" alt="" width="24" height="24"> Daniel Inc.</a>
  <nav class="nav" aria-label="Site">
    <button class="pill" id="b-list" type="button" aria-expanded="false">Projects</button>
    <button class="pill" id="b-refresh" type="button">Refresh</button>
  </nav>
</header>
<h1 class="sr-only">Daniel Inc. · GitHub projects of danieltheparasite</h1>
<div id="stage"><p class="fallback">The 3D desk needs a web server and an internet connection to load three.js. See README.md.</p></div>
<iframe id="site" title="Deployed project" hidden sandbox="allow-scripts allow-same-origin allow-forms allow-popups"></iframe>
<div id="bar" hidden><button class="pill" id="back" type="button">Back to the desk · Esc</button><a class="pill" id="out" target="_blank" rel="noopener">Open on GitHub</a></div>
<div id="tip" role="status"></div>
<aside id="list" hidden aria-label="All projects"><h2>Projects</h2><p id="sync"></p><ul id="items"></ul></aside>
<p class="hints"><kbd>Drag</kbd> orbit <kbd>Click</kbd> laptop, book, red button <kbd>Esc</kbd> back <kbd>R</kbd> refresh</p>
<script>
(()=>{const c=document.getElementById('pic'),x=c.getContext('2d'),im=new Image(),st=document.getElementById('boot-status'),f=document.getElementById('fill'),off=document.createElement('canvas'),T=['Waking up the desk…','Calling github.com/danieltheparasite…','Stacking the books…','Warming up the laptop…','Dusting off the confidential file…'],t0=performance.now();let p=0,tgt=0,msg='',lock=0;im.src='assets/profile.png';
window.boot={p:(n,t)=>{tgt=n;msg=t;lock=1}};
(function loop(){const el=performance.now()-t0;p+=(Math.max(55*(1-Math.exp(-el/1800)),tgt)-p)*.12;f.style.width=p+'%';
if(im.complete&&im.naturalWidth){const n=Math.max(4,Math.round(4+p*.6));off.width=off.height=n;off.getContext('2d').drawImage(im,0,0,n,n);x.imageSmoothingEnabled=false;x.clearRect(0,0,64,64);x.drawImage(off,0,0,64,64)}
st.textContent=(lock?msg:T[Math.floor(el/900)%T.length])+(Math.floor(el/400)%2?' ▌':'');
if(!document.getElementById('loader').classList.contains('done'))requestAnimationFrame(loop)})();})();
</script>
</body>
</html>
